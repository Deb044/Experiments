[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "o3-vla"
version = "0.1.0"
description = "O3-inspired continual behavior suppression for vision-language-action policies"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "torch>=2.2", "Pillow>=10", "h5py>=3.10", "scikit-learn>=1.3", "matplotlib>=3.8", "imageio>=2.34", "imageio-ffmpeg>=0.5", "psutil>=5.9", "nvidia-ml-py>=12"]

[project.optional-dependencies]
openvla = ["transformers==4.40.1", "tokenizers==0.19.1", "timm==0.9.10", "bitsandbytes>=0.46,<0.49", "accelerate>=0.30,<2", "sentencepiece>=0.2", "huggingface-hub>=0.23,<1", "tensorflow-cpu>=2.16,<2.18"]
test = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
o3-vla = "o3_vla.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint.per-file-ignores]
# Episode failures must be recorded as invalid, and NVML errors are optional diagnostics.
"src/o3_vla/evaluation.py" = ["BLE001"]
"src/o3_vla/telemetry.py" = ["BLE001"]
